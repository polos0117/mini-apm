<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 APM</title>
<style>
  :root { --bg: #0f1419; --panel: #182028; --line: #2a3440; --text: #d8dee6; --dim: #8593a3; --ok: #4ea1ff; --err: #ff5c5c; --warn: #ffcc4d; --good: #4ade80;
    --method: #a78bfa; --mapper: #2dd4bf; --sql: #4ea1ff; --http: #4ade80; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: radial-gradient(ellipse at top, #17233b, var(--bg) 70%) fixed var(--bg); min-height: 100vh; color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  h2 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  #tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile b { display: block; font-size: 32px; color: #f1f5f9; font-variant-numeric: tabular-nums; }
  .tile { border-top: 3px solid var(--c); }
  .tile b.good { color: var(--good); }
  .tile b.warn { color: var(--warn); }
  .tile b.err { color: var(--err); }
  .panel:not(.tile) h2::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ok)); margin-right: 6px; vertical-align: 1px; }
  #main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; margin-bottom: 12px; }
  #xview { width: 100%; height: 360px; display: block; cursor: crosshair; touch-action: none; }
  #active { max-height: 360px; overflow: auto; }
  #active table { table-layout: fixed; }
  #active td.num { width: 64px; }
  #active tr:has(+ tr.sub) td { border-bottom: 0; }
  #active tr.sub td { padding-top: 0; font-size: 12px; opacity: 0.75; }
  td.ell { overflow: hidden; text-overflow: ellipsis; }
  section { margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.text { white-space: normal; word-break: break-all; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #22303c; }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .bar { position: relative; height: 10px; min-width: 240px; background: #0b0f13; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--ok); }
  .k-method { color: var(--method); }
  .k-mapper { color: var(--mapper); }
  .k-sql { color: var(--sql); }
  .k-http { color: var(--http); }
  .k-exception { color: var(--err); }
  .bar i.k-method { background: var(--method); opacity: 0.55; }
  .bar i.k-mapper { background: var(--mapper); opacity: 0.55; }
  .bar i.k-sql { background: var(--sql); }
  .bar i.k-http { background: var(--http); }
  .bar i.k-exception, .bar i.err { background: var(--err); }
  .req { margin: -4px 0 8px; color: var(--dim); word-break: break-all; }
  #status { font-weight: 400; }
  #alertbar { display: flex; gap: 12px; align-items: flex-start; background: #3a1418; border: 1px solid var(--err); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  #alertbar[hidden] { display: none; }
  #alerts { margin: 0; padding: 0; list-style: none; flex: 1; min-width: 0; }
  #alerts li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  #tabs { display: flex; gap: 4px; margin-right: 12px; }
  #tabs a { color: var(--dim); text-decoration: none; font-weight: 600; padding: 4px 8px; border-bottom: 2px solid transparent; }
  #tabs a.on { color: var(--text); border-bottom-color: var(--ok); }
  body[data-tab=live] [data-tab=stats], body[data-tab=stats] [data-tab=live] { display: none !important; } /* #main·#tiles의 display보다 앞서게 */
  #apps { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
  button:disabled { cursor: default; color: var(--dim); }
  #apps button.on, #ranges button.on { border-color: var(--ok); color: var(--ok); }
  #ranges { font-weight: 400; margin-left: 8px; }
  #routes { max-height: 60vh; overflow: auto; }
  #routes table { table-layout: fixed; }
  #routes th { cursor: pointer; user-select: none; }
  #routes th:not(:first-child), #routes td:not(:first-child) { width: 92px; }
  #apps button.down::after { content: ' ●'; color: var(--err); }
  #settings { margin-left: auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: var(--dim); font-size: 13px; }
  #settings input[type=number] { width: 56px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  #legend { font-weight: 400; margin-left: 8px; }
  #errlist { max-height: 240px; overflow: auto; }
  #errlist table { table-layout: fixed; }
  #errlist td:nth-child(1) { width: 90px; }
  #errlist td:nth-child(2) { width: 110px; }
  #errlist td:nth-child(3) { width: 40%; }
</style>
</head>
<body data-tab="live">
  <div id="alertbar" hidden><ul id="alerts"></ul><button id="ack">확인</button></div>
  <div id="bar">
    <nav id="tabs"><a href="#live">실시간</a><a href="#stats">API별 통계</a></nav>
    <div id="apps"></div>
    <div id="settings">
      <label><input type="checkbox" id="optErrors"> 에러 경보</label>
      <label><input type="checkbox" id="optDown"> 끊김 경보</label>
      <label>끊김 기준 <input type="number" id="optDownSec" min="1" max="600"> 초</label>
      <button id="notify" hidden>알림 켜기</button>
    </div>
  </div>
  <div id="tiles" data-tab="live">
    <div class="panel tile" style="--c: var(--ok)"><h2>초당 처리량(TPS)</h2><b id="tps">-</b></div>
    <div class="panel tile" style="--c: var(--mapper)"><h2>평균 응답(ms)</h2><b id="avg">-</b></div>
    <div class="panel tile" style="--c: var(--method)"><h2>응답 95%(p95, ms)</h2><b id="p95">-</b></div>
    <div class="panel tile" style="--c: var(--err)"><h2>에러</h2><b id="errors">-</b></div>
  </div>
  <div id="main" data-tab="live">
    <div class="panel"><h2>X-View — 영역을 끌어서 고르세요 <span id="legend"></span> <span id="status"></span></h2><canvas id="xview"></canvas></div>
    <div class="panel" style="--c: var(--warn)"><h2>처리 중인 요청</h2><div id="active">없음</div></div>
  </div>
  <section class="panel" data-tab="live" style="--c: var(--err)"><h2>최근 에러</h2><div id="errlist">없음</div></section>
  <section class="panel" data-tab="stats" style="--c: var(--method)"><h2>API별 통계 <span id="ranges"><button data-range="10m">최근 10분</button> <button data-range="all">서버 켠 뒤 전체</button></span></h2><div id="routes">없음</div></section>
  <section class="panel" style="--c: var(--mapper)"><h2>고른 트랜잭션</h2><table id="picked"></table></section>
  <section class="panel" style="--c: var(--good)"><h2>트랜잭션 상세</h2><div id="detail">목록에서 한 줄을 누르세요.</div></section>
  <script type="module" src="app.mjs"></script>
</body>
</html>
